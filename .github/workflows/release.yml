name: Release with goreleaser
on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*
jobs:
  collect-grpc-health:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - amd64
          - arm64
    steps:
      - name: Get grpc health check
        run: |
          mkdir -p ${{ runner.temp }}/linux/${{matrix.config}}
          curl -L https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v0.4.36/grpc_health_probe-linux-${{matrix.config}} -o ${{ runner.temp }}/linux/${{matrix.config}}/grpc_health_probe
      - name: Upload health check artifacts
        uses: actions/upload-artifact@v7
        with:
          name: grpc-${{matrix.config}}
          path: ${{ runner.temp }}/linux/${{matrix.config}}/grpc_health_probe

  goreleaser:
    needs:
      - collect-grpc-health
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # this is important, otherwise it won't checkout the full tree (i.e. no previous tags)

      - name: Download grpc health check artifacts (amd64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: grpc-amd64
          path: ext/healthcheck/linux/amd64
      - name: Download grpc health check artifacts (arm64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: grpc-arm64
          path: ext/healthcheck/linux/arm64

      - name: Add execute permissions
        run: chmod +x ext/healthcheck/linux/{amd64,arm64}/*

      - name: Show ext/healthcheck
        run: ls -laR ext/healthcheck

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: "./go.mod"

      - name: setup qemu for docker
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - name: Prepare cosign installer
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Login to Github Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        id: rd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare changelog
        run: |
          echo "${{ steps.rd.outputs.body }}" > /tmp/CHANGELOG.md

      - name: Release via goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --release-notes=/tmp/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # Note: The standard setting for the repository doesn't allow the default GITHUB_TOKEN to be used here
        # Either define a separate Personal Access Token or permit the default GITHUB_TOKEN read/write access
        # see section "Workflow permissions" on https://github.com/mpapenbr/iracelog-service-manager-go/settings/actions

      - name: Attest checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest digests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/digests.txt
